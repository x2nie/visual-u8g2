<!DOCTYPE html>
<html>
<head>
    <title>Box Editor Canvas</title>
    <!-- code generated by LLM deepseek -->
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { border: 1px solid #ccc; display: block; }
        .controls { padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="addBox">Tambah Box</button>
        <button id="deleteBox">Hapus Box</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        // Inisialisasi canvas
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set ukuran canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Data box
        let boxes = [
            { left: 100, top: 100, width: 200, height: 150, color: '#3498db' }
        ];
        let selectedBox = null;
        let selectedHandle = null;
        let isDragging = false;
        let offsetX, offsetY;

        // Handle resize
        const HANDLE_SIZE = 8;
        const handles = [
            'nw', 'n', 'ne', 
            'w', 'e', 
            'sw', 's', 'se'
        ];

        // Gambar box dan handle
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            boxes.forEach(box => {
                // Gambar box
                ctx.fillStyle = box.color;
                ctx.fillRect(box.left, box.top, box.width, box.height);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(box.left, box.top, box.width, box.height);
                
                // Gambar handle jika box dipilih
                if (box === selectedBox) {
                    drawHandles(box);
                }
            });
        }

        function drawHandles(box) {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            
            // NW
            ctx.fillRect(box.left - HANDLE_SIZE/2, box.top - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left - HANDLE_SIZE/2, box.top - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // N
            ctx.fillRect(box.left + box.width/2 - HANDLE_SIZE/2, box.top - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left + box.width/2 - HANDLE_SIZE/2, box.top - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // NE
            ctx.fillRect(box.left + box.width - HANDLE_SIZE/2, box.top - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left + box.width - HANDLE_SIZE/2, box.top - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // W
            ctx.fillRect(box.left - HANDLE_SIZE/2, box.top + box.height/2 - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left - HANDLE_SIZE/2, box.top + box.height/2 - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // E
            ctx.fillRect(box.left + box.width - HANDLE_SIZE/2, box.top + box.height/2 - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left + box.width - HANDLE_SIZE/2, box.top + box.height/2 - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // SW
            ctx.fillRect(box.left - HANDLE_SIZE/2, box.top + box.height - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left - HANDLE_SIZE/2, box.top + box.height - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // S
            ctx.fillRect(box.left + box.width/2 - HANDLE_SIZE/2, box.top + box.height - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left + box.width/2 - HANDLE_SIZE/2, box.top + box.height - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            
            // SE
            ctx.fillRect(box.left + box.width - HANDLE_SIZE/2, box.top + box.height - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
            ctx.strokeRect(box.left + box.width - HANDLE_SIZE/2, box.top + box.height - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
        }

        // Cek apakah klik mengenai handle
        function getHandleAt(x, y, box) {
            if (!box) return null;
            
            // NW
            if (isInHandle(x, y, box.left, box.top)) return 'nw';
            // N
            if (isInHandle(x, y, box.left + box.width/2, box.top)) return 'n';
            // NE
            if (isInHandle(x, y, box.left + box.width, box.top)) return 'ne';
            // W
            if (isInHandle(x, y, box.left, box.top + box.height/2)) return 'w';
            // E
            if (isInHandle(x, y, box.left + box.width, box.top + box.height/2)) return 'e';
            // SW
            if (isInHandle(x, y, box.left, box.top + box.height)) return 'sw';
            // S
            if (isInHandle(x, y, box.left + box.width/2, box.top + box.height)) return 's';
            // SE
            if (isInHandle(x, y, box.left + box.width, box.top + box.height)) return 'se';
            
            return null;
        }

        function isInHandle(x, y, handleX, handleY) {
            return x >= handleX - HANDLE_SIZE && x <= handleX + HANDLE_SIZE &&
                   y >= handleY - HANDLE_SIZE && y <= handleY + HANDLE_SIZE;
        }

        // Cek apakah klik mengenai box
        function getBoxAt(x, y) {
            for (let i = boxes.length - 1; i >= 0; i--) {
                const box = boxes[i];
                if (x >= box.left && x <= box.left + box.width &&
                    y >= box.top && y <= box.top + box.height) {
                    return box;
                }
            }
            return null;
        }

        // Event listeners
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            selectedBox = getBoxAt(x, y);
            if (selectedBox) {
                selectedHandle = getHandleAt(x, y, selectedBox);
                
                if (selectedHandle) {
                    // Resize mode
                    isDragging = true;
                    offsetX = x - selectedBox.left;
                    offsetY = y - selectedBox.top;
                } else {
                    // Move mode
                    isDragging = true;
                    offsetX = x - selectedBox.left;
                    offsetY = y - selectedBox.top;
                }
            }
            
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || !selectedBox) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (selectedHandle) {
                // Resize box berdasarkan handle
                switch (selectedHandle) {
                    case 'nw':
                        selectedBox.width += selectedBox.left - x;
                        selectedBox.height += selectedBox.top - y;
                        selectedBox.left = x;
                        selectedBox.top = y;
                        break;
                    case 'n':
                        selectedBox.height += selectedBox.top - y;
                        selectedBox.top = y;
                        break;
                    case 'ne':
                        selectedBox.width = x - selectedBox.left;
                        selectedBox.height += selectedBox.top - y;
                        selectedBox.top = y;
                        break;
                    case 'w':
                        selectedBox.width += selectedBox.left - x;
                        selectedBox.left = x;
                        break;
                    case 'e':
                        selectedBox.width = x - selectedBox.left;
                        break;
                    case 'sw':
                        selectedBox.width += selectedBox.left - x;
                        selectedBox.height = y - selectedBox.top;
                        selectedBox.left = x;
                        break;
                    case 's':
                        selectedBox.height = y - selectedBox.top;
                        break;
                    case 'se':
                        selectedBox.width = x - selectedBox.left;
                        selectedBox.height = y - selectedBox.top;
                        break;
                }
                
                // Batasi ukuran minimum
                if (selectedBox.width < 20) selectedBox.width = 20;
                if (selectedBox.height < 20) selectedBox.height = 20;
            } else {
                // Move box
                selectedBox.left = x - offsetX;
                selectedBox.top = y - offsetY;
                
                // Batasi agar tidak keluar canvas
                if (selectedBox.left < 0) selectedBox.left = 0;
                if (selectedBox.top < 0) selectedBox.top = 0;
                if (selectedBox.left + selectedBox.width > canvas.width) 
                    selectedBox.left = canvas.width - selectedBox.width;
                if (selectedBox.top + selectedBox.height > canvas.height) 
                    selectedBox.top = canvas.height - selectedBox.height;
            }
            
            draw();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            selectedHandle = null;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            selectedHandle = null;
        });

        // Tombol tambah box
        document.getElementById('addBox').addEventListener('click', () => {
            const colors = ['#3498db', '#2ecc71', '#e74c3c', '#f1c40f', '#9b59b6'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            boxes.push({
                left: 50,
                top: 50,
                width: 150,
                height: 100,
                color: color
            });
            
            draw();
        });

        // Tombol hapus box
        document.getElementById('deleteBox').addEventListener('click', () => {
            if (selectedBox) {
                const index = boxes.indexOf(selectedBox);
                if (index !== -1) {
                    boxes.splice(index, 1);
                    selectedBox = null;
                    draw();
                }
            }
        });

        // Gambar awal
        draw();
    </script>
</body>
</html>
